[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openesm-toolkit"
version = "0.1.0"
description = "Reusable Python utilities, statistical modeling, machine learning, and data engineering tools"
requires-python = ">=3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true


# Ruff - Python Linting and Formatting

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "renv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E4",  # Import and related errors
    "E7",  # Statement formatting errors
    "E9",  # Syntax errors
    "F",   # Pyflakes: unused imports, undefined names
    "B",   # Bugbear: potential bugs
    "UP",  # Pyupgrade: modern Python syntax
]

# Preserve your preferred functional import organization
ignore = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"